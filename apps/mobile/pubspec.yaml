name: aes_mobile
description: AES Operations & Finance Management System — Flutter mobile client (BLoC + Cubit).
publish_to: "none"
version: 0.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # State management — BLoC + Cubit
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5
  # Routing
  go_router: ^13.2.0
  # HTTP client (dio) — generated OpenAPI client wraps this in later stages
  dio: ^5.4.0
  # Local secure config / token storage
  flutter_secure_storage: ^9.0.0
  # Biometric (Face ID / fingerprint) confirmation on money approvals
  local_auth: ^2.2.0
  # Camera / gallery capture for receipt attachments
  image_picker: ^1.1.2
  # Offline-first: local SQLite outbox + connectivity detection
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
