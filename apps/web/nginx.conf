server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unknown path serves index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the NestJS service (name resolvable on the compose/DO network).
    # Set API_UPSTREAM at deploy time; defaults to the compose service name.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache built static assets aggressively (hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
