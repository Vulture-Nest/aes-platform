# Local development infrastructure for the AES platform.
#   docker compose -f docker-compose.dev.yml up -d
# Provides Postgres 16, Redis 7 and MinIO (local stand-in for SharePoint/Graph
# file storage behind the API's StorageService interface).

services:
  postgres:
    image: postgres:16
    container_name: aes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aes_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aes} -d ${POSTGRES_DB:-aes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: aes-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aes-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aes-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aes_minio_local_dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
