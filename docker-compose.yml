# Full local stack — API + web + infrastructure, all built and run locally.
#   docker compose up --build
#
# Mirrors the production topology (DigitalOcean droplet: web(nginx) -> api -> managed PG).
# For running api/web from source instead, use docker-compose.dev.yml (infra only).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aes_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aes} -d ${POSTGRES_DB:-aes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aes-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aes_minio_local_dev}
    volumes:
      - miniodata:/data

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aes}:${POSTGRES_PASSWORD:-aes_local_dev}@postgres:5432/${POSTGRES_DB:-aes}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: 9000
      STORAGE_USE_SSL: "false"
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-aes-minio}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aes_minio_local_dev}
      STORAGE_BUCKET: aes-files
      # Required from S1 (local JWT auth). Override in a real .env.
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-please}
    ports:
      - "3000:3000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  miniodata:
