name: Release Mobile

# Builds a signed Android App Bundle and uploads it to Google Play.
#
# Trigger: push a tag such as `mobile-v1.2.0`, or run manually from the Actions
# tab to pick the version and track yourself.
#
#   git tag mobile-v1.2.0 && git push origin mobile-v1.2.0
#
# versionName comes from the tag; versionCode comes from the workflow run number,
# which is monotonic per repository — Play requires a strictly increasing value.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64     base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias inside the keystore
#   ANDROID_KEY_PASSWORD        key password
#   PLAY_SERVICE_ACCOUNT_JSON   Google Play service-account JSON key
#
# NOTE: the very first upload for a package must be made by hand in the Play
# Console. The Play Developer API refuses a package that has never had a release.

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.2.0'
        required: true
      track:
        description: 'Play track to publish to'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: read

concurrency:
  group: release-mobile
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.35.x'
  PACKAGE_NAME: org.vulturenest.aes

jobs:
  release:
    name: Build & publish (AES Operations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ inputs.version }}"
            TRACK="${{ inputs.track }}"
          else
            NAME="${GITHUB_REF_NAME#mobile-v}"
            TRACK="internal"
          fi
          if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$NAME' is not semver (expected e.g. 1.2.0)"
            exit 1
          fi
          echo "name=$NAME"                      >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}"   >> "$GITHUB_OUTPUT"
          echo "track=$TRACK"                    >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME (versionCode ${{ github.run_number }}) to $TRACK"

      - run: flutter pub get

      # A release that fails its own tests should never reach a device.
      - run: flutter analyze
      - run: flutter test

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — cannot sign a release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle \
            --flavor prod \
            -t lib/main_prod.dart \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"

      # Proves the artifact carries the upload key rather than the debug key,
      # which Play would reject with an unhelpful error.
      - name: Verify signature
        run: |
          AAB=build/app/outputs/bundle/prodRelease/app-prod-release.aab
          jarsigner -verify -verbose:summary -certs "$AAB" | grep -q "jar verified" \
            || { echo "::error::Bundle is not signed"; exit 1; }
          if jarsigner -verify -verbose:summary -certs "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::Bundle is debug-signed — Play will reject it."
            exit 1
          fi
          echo "Signed by: $(jarsigner -verify -verbose:summary -certs "$AAB" | grep -m1 'X.509')"

      - uses: actions/upload-artifact@v4
        with:
          name: aes-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: apps/mobile/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 90

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: apps/mobile/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ steps.version.outputs.track }}
          status: completed

      - name: Summary
        if: always()
        run: |
          {
            echo "### AES Operations"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Package | \`${{ env.PACKAGE_NAME }}\` |"
            echo "| Version | ${{ steps.version.outputs.name }} |"
            echo "| Version code | ${{ steps.version.outputs.code }} |"
            echo "| Track | ${{ steps.version.outputs.track }} |"
          } >> "$GITHUB_STEP_SUMMARY"
