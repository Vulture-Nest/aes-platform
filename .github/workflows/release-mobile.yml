name: Release Mobile

# Builds a signed Android App Bundle and uploads it to Google Play.
#
# Trigger: automatically on every merge to main that touches apps/mobile/
# (published to both the `internal` and `alpha` [Closed testing] tracks — no
# Google review, invisible outside those tester lists); or push a tag such as
# `mobile-v1.2.0` (same two tracks); or run manually from the Actions tab to
# pick the version and a single track yourself (e.g. to promote to production).
#
#   git tag mobile-v1.2.0 && git push origin mobile-v1.2.0
#
# versionName comes from the tag (tag pushes) or straight from pubspec.yaml
# (plain merges to main); versionCode comes from the workflow run number,
# which is monotonic per repository — Play requires a strictly increasing value.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64     base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias inside the keystore
#   ANDROID_KEY_PASSWORD        key password
#   PLAY_SERVICE_ACCOUNT_JSON   Google Play service-account JSON key
#
# NOTE: the very first upload for a package must be made by hand in the Play
# Console. The Play Developer API refuses a package that has never had a release.

on:
  push:
    branches: [main]
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.2.0'
        required: true
      track:
        description: 'Play track to publish to'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: read

concurrency:
  group: release-mobile
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.35.x'
  PACKAGE_NAME: org.vulturenest.aes

jobs:
  # This repo is a monorepo (backend + web + mobile). Tag pushes and manual
  # runs always mean "release the app" — but a plain merge to main might not
  # have touched apps/mobile/ at all, and publishing a new internal build for
  # e.g. a backend-only change would just churn Play's release history.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref_type == 'branch'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=${{ steps.filter.outputs.mobile }}" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.filter.outputs.mobile }}" != "true" ]; then
              echo "No changes under apps/mobile/ in this merge — skipping mobile release."
            fi
          fi

  release:
    name: Build & publish (AES Operations)
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ inputs.version }}"
            TRACKS="${{ inputs.track }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#mobile-v}"
            TRACKS="internal,alpha"
          else
            # Plain merge to main: no tag, no manual input — take the version
            # name straight from pubspec.yaml. Every automatic release (tag or
            # plain merge) goes out to both internal and closed testing (alpha)
            # so external testers see it too; promote further via manual dispatch.
            NAME=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
            TRACKS="internal,alpha"
          fi
          if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$NAME' is not semver (expected e.g. 1.2.0)"
            exit 1
          fi
          echo "name=$NAME"                      >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}"   >> "$GITHUB_OUTPUT"
          echo "tracks=$TRACKS"                   >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME (versionCode ${{ github.run_number }}) to $TRACKS"

      # --enforce-lockfile makes a release build fail rather than silently
      # resolving different package versions than were tested. Requires
      # pubspec.lock to be committed, which it is.
      - run: flutter pub get --enforce-lockfile

      # A release that fails its own tests should never reach a device.
      - run: flutter analyze
      - run: flutter test

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — cannot sign a release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle \
            --flavor prod \
            -t lib/main_prod.dart \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"

      # Proves the artifact carries the upload key rather than the debug key,
      # which Play would reject with an unhelpful error.
      - name: Verify signature
        run: |
          AAB=build/app/outputs/bundle/prodRelease/app-prod-release.aab
          jarsigner -verify -verbose:summary -certs "$AAB" | grep -q "jar verified" \
            || { echo "::error::Bundle is not signed"; exit 1; }
          if jarsigner -verify -verbose:summary -certs "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::Bundle is debug-signed — Play will reject it."
            exit 1
          fi
          echo "Signed by: $(jarsigner -verify -verbose:summary -certs "$AAB" | grep -m1 'X.509')"

      - uses: actions/upload-artifact@v4
        with:
          name: aes-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: apps/mobile/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 90

      # One upload, assigned to every track in steps.version.outputs.tracks
      # (comma-separated) — the action's `tracks` (plural) input uploads the
      # bundle once and assigns it to all of them in the same edit. Calling
      # the action a second time with `track` (singular) for a second track
      # does NOT work: Play rejects re-uploading a bundle whose versionCode
      # was already used by the first call ("Version code N has already been
      # used"), even for a different track.
      - name: Upload to Google Play (${{ steps.version.outputs.tracks }})
        id: play_multi
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: apps/mobile/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          tracks: ${{ steps.version.outputs.tracks }}
          status: completed

      # A track that Play doesn't consider ready yet (e.g. alpha/Closed
      # testing before its Store listing / App content / target audience are
      # filled in — "Only releases with status draft may be created on draft
      # app") fails the WHOLE multi-track edit above, internal included. Fall
      # back to internal alone so that, at minimum, the pipeline that used to
      # work on its own keeps working while Play Console setup catches up.
      - name: Warn on multi-track failure
        if: steps.play_multi.outcome == 'failure'
        run: echo "::warning::Multi-track Play upload (${{ steps.version.outputs.tracks }}) failed — see the previous step's log. Falling back to internal-only. This is very likely a Play Console app-readiness gate (Store listing / App content / target audience / data safety not yet complete) blocking a non-internal track, not a build problem."

      - name: Upload to Google Play (internal — fallback)
        id: play_internal_fallback
        if: steps.play_multi.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: apps/mobile/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          tracks: internal
          status: completed

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.play_multi.outcome }}" = "success" ]; then
            ACTUAL="${{ steps.version.outputs.tracks }}"
          else
            ACTUAL="internal only (fallback — ${{ steps.version.outputs.tracks }} failed; check Play Console readiness for the other track(s))"
          fi
          {
            echo "### AES Operations"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Package | \`${{ env.PACKAGE_NAME }}\` |"
            echo "| Version | ${{ steps.version.outputs.name }} |"
            echo "| Version code | ${{ steps.version.outputs.code }} |"
            echo "| Track(s) | $ACTUAL |"
          } >> "$GITHUB_STEP_SUMMARY"
