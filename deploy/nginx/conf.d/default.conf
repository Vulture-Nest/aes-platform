# Host-based routing. Replace *.aes.example.com with your real domain once its
# DNS A-records (api. / admin. / app. / apex) point at the droplet, then enable
# TLS (certbot writes into ./nginx/ssl + ./nginx/certbot). Until DNS exists, the
# default_server block below serves everything on the droplet's bare IP.

# ── API — api.<domain> (also the base URL the mobile app talks to) ────────────
server {
    listen 80;
    server_name api.aes.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Health check — no rate limit.
    location = /health {
        proxy_pass http://aes_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints — strict rate limit.
    location /v1/auth {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://aes_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://aes_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Admin console — admin.<domain> ────────────────────────────────────────────
# (Built to serve at root `/`, so it needs its own hostname, not a sub-path.)
server {
    listen 80;
    server_name admin.aes.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://aes_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── End-user web app — <domain> and app.<domain> ──────────────────────────────
server {
    listen 80;
    server_name aes.example.com app.aes.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://aes_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── IP fallback — works immediately, before any DNS ───────────────────────────
# Bare droplet IP: web at /, API at /api/. (Admin is reachable via its subdomain;
# for pre-DNS admin access, temporarily add the IP to the admin server_name above.)
server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://aes_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://aes_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
