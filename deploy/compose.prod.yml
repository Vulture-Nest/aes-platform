# Production compose for the DigitalOcean droplet.
# Runs prebuilt images pulled from the registry. Postgres is DO Managed PostgreSQL
# (external, shared cluster — a dedicated `aes` database + user); no postgres service
# here — DATABASE_URL points at the managed cluster.
#
# Secrets live in a droplet-local `.env` (see .env.production.example), NOT in GitHub.
# The deploy workflow only exports REGISTRY + IMAGE_TAG so it can pull the right images.
#
#   docker compose -f compose.prod.yml pull
#   docker compose -f compose.prod.yml up -d

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aes]

  api:
    image: ${REGISTRY}/aes-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # DATABASE_URL, JWT_SECRET and STORAGE_* come from the droplet-local .env.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks: [aes]

  admin:
    image: ${REGISTRY}/aes-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    networks: [aes]

  web:
    image: ${REGISTRY}/aes-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    networks: [aes]

  # Reverse proxy — the only container bound to the host. Routes by hostname:
  #   api.<domain>   -> api,   admin.<domain> -> admin,   app.<domain>/<domain> -> web.
  # The web/admin containers each proxy their own /api to the api service, so the
  # SPAs work same-origin. See nginx/conf.d/default.conf.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - admin
      - web
    networks: [aes]

volumes:
  redisdata:

networks:
  aes:
    driver: bridge
