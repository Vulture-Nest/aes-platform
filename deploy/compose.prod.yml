# Production compose for the SHARED DigitalOcean droplet.
# Runs prebuilt images pulled from the registry. Postgres is DO Managed PostgreSQL
# (external, shared cluster — a dedicated `aes` database + user); no postgres service
# here — DATABASE_URL points at the managed cluster.
#
# TLS + public routing is handled by the shared Traefik edge (see vulturenest-infra),
# NOT by a per-app nginx. Each public container joins the external `edge` network and
# declares its hostname via Traefik labels. Nothing here binds a host port, so a
# deploy of this stack never touches the edge or the other apps.
#
# Secrets + hostnames live in a droplet-local `.env` (see .env.production.example),
# NOT in GitHub. The deploy workflow only exports REGISTRY + IMAGE_TAG.
#
#   docker compose -f compose.prod.yml pull
#   docker compose -f compose.prod.yml up -d --remove-orphans

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aes]               # internal only — never exposed

  api:
    image: ${REGISTRY}/aes-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # DATABASE_URL, DATABASE_URL_OWNER, JWT_SECRET, STORAGE_* come from the droplet .env.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks: [aes]
    labels:
      - traefik.enable=true
      - traefik.docker.network=aes
      - traefik.http.routers.aes-api.rule=Host(`${API_HOST}`)
      - traefik.http.routers.aes-api.entrypoints=websecure
      - traefik.http.routers.aes-api.tls.certresolver=le
      - traefik.http.services.aes-api.loadbalancer.server.port=3000

  admin:
    image: ${REGISTRY}/aes-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    # Override the image healthcheck: it uses http://localhost/ which resolves to
    # IPv6 (::1) while nginx listens IPv4-only, so it false-fails and Traefik (which
    # won't route to unhealthy containers) drops it. 127.0.0.1 fixes it, no rebuild.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [aes]
    labels:
      - traefik.enable=true
      - traefik.docker.network=aes
      - traefik.http.routers.aes-admin.rule=Host(`${ADMIN_HOST}`)
      - traefik.http.routers.aes-admin.entrypoints=websecure
      - traefik.http.routers.aes-admin.tls.certresolver=le
      - traefik.http.services.aes-admin.loadbalancer.server.port=80

  web:
    image: ${REGISTRY}/aes-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    # See admin healthcheck note — 127.0.0.1 avoids the IPv6 localhost false-fail.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [aes]
    labels:
      - traefik.enable=true
      - traefik.docker.network=aes
      - traefik.http.routers.aes-web.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.aes-web.entrypoints=websecure
      - traefik.http.routers.aes-web.tls.certresolver=le
      - traefik.http.services.aes-web.loadbalancer.server.port=80

volumes:
  redisdata:

networks:
  # Dedicated per-app network shared only with Traefik (created by server-setup.sh:
  # `docker network create aes`). Keeps `api`/`web`/`admin` service names unique to
  # this app so the web container's /api proxy can't hit another app's API.
  aes:
    external: true
